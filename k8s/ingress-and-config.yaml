apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortlink-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Belt-and-suspenders: app-level rate limiting (Redis token bucket) is
    # the source of truth for per-user/per-key limits, but a coarse
    # ingress-level cap protects against raw volumetric abuse before it
    # even reaches the app tier.
    nginx.ingress.kubernetes.io/limit-rps: "200"
spec:
  tls:
    - hosts: ["short.example.com"]
      secretName: shortlink-tls
  rules:
    - host: short.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shortlink-api
                port: { number: 80 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shortlink-config
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  SHORTLINK_DOMAINS: "short.example.com"
  PUBLIC_BASE_URL: "https://short.example.com"
  REDIS_CACHE_TTL_SECONDS: "3600"
  RATE_LIMIT_ANONYMOUS_PER_MIN: "30"
  RATE_LIMIT_AUTHENTICATED_PER_MIN: "300"
  RATE_LIMIT_REDIRECT_PER_MIN: "1000"
  CLICK_EVENT_RETENTION_DAYS: "90"
---
# Template only — never commit real secret values to version control.
# In production, generate this via `kubectl create secret generic` from a
# secrets manager (AWS Secrets Manager / GCP Secret Manager / Vault),
# ideally through an operator like External Secrets Operator so the
# manifest itself never contains plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: shortlink-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgres://REPLACE:REPLACE@REPLACE:5432/shortlink"
  REDIS_URL: "redis://REPLACE:6379"
  JWT_ACCESS_SECRET: "REPLACE_WITH_openssl_rand_hex_32"
  JWT_REFRESH_SECRET: "REPLACE_WITH_openssl_rand_hex_32"
  SHORTCODE_SECRET: "REPLACE_WITH_openssl_rand_hex_32"
  IP_HASH_SALT: "REPLACE_WITH_random_value"
