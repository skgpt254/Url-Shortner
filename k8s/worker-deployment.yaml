apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortlink-worker
  labels: { app: shortlink-worker }
spec:
  # Sized to sustained click throughput, not request concurrency — a
  # deliberately different scaling dimension from the API deployment (see
  # README "Why a separate worker service").
  replicas: 2
  selector:
    matchLabels: { app: shortlink-worker }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 1 }
  template:
    metadata:
      labels: { app: shortlink-worker }
    spec:
      containers:
        - name: worker
          image: shortlink-worker:latest # replace with your registry path + immutable tag
          envFrom:
            - configMapRef: { name: shortlink-config }
            - secretRef: { name: shortlink-secrets }
          env:
            - name: CLICK_WORKER_CONCURRENCY
              value: "10"
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      terminationGracePeriodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shortlink-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shortlink-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  # Better still in production: scale on BullMQ queue depth via a custom
  # metrics adapter (KEDA's redis-list/bullmq scaler is a good fit) rather
  # than CPU alone — queue backlog is the metric that actually reflects
  # whether the worker fleet is keeping up.
