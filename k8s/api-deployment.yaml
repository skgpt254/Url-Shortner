apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortlink-api
  labels: { app: shortlink-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: shortlink-api }
  # Rolling update with zero downtime: never take more than 1 replica out
  # of rotation at a time, and always have at least `replicas` available.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: shortlink-api }
    spec:
      containers:
        - name: api
          image: shortlink-api:latest # replace with your registry path + immutable tag (commit SHA) in CI
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: shortlink-config }
            - secretRef: { name: shortlink-secrets }
          resources:
            # Requests/limits sized for a moderate-traffic redirect service;
            # tune based on actual load-test results before production use.
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1000m", memory: "512Mi" }
          # Liveness: is the process alive at all? Kept minimal (no downstream
          # dependency checks) so a transient DB blip doesn't cause k8s to
          # kill and restart otherwise-healthy pods.
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: can this pod actually serve traffic right now? Checks
          # real DB/Redis connectivity — a pod failing this is pulled from
          # the Service's load-balancing rotation without being restarted.
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          # Give in-flight requests time to finish before SIGTERM during a
          # rolling deploy or scale-down (matches the 10s force-exit timer
          # in server.ts).
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: shortlink-api
spec:
  selector: { app: shortlink-api }
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP # fronted by an Ingress / cloud load balancer, see ingress.yaml
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shortlink-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shortlink-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    # Scale up fast (traffic spikes on a redirect service can be sudden —
    # a link going viral), scale down cautiously to avoid flapping.
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{ type: Percent, value: 100, periodSeconds: 30 }]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Percent, value: 25, periodSeconds: 60 }]
