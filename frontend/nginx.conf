server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Long-cache hashed build assets (filenames include a content hash, so
    # this is safe — a new deploy produces new filenames, never stale
    # content under an old name).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to the backend container. This is what lets the
    # frontend use relative /api/... paths (see src/api/client.ts) and
    # never deal with CORS in the local docker-compose stack — nginx makes
    # the browser see everything as one origin.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any unmatched path serves index.html so client-side
    # routing (react-router) handles it, instead of nginx 404ing on a
    # direct load of e.g. /dashboard/links/abc123.
    location / {
        try_files $uri /index.html;
    }
}
