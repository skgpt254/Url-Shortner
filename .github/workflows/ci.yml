name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shortlink
          POSTGRES_PASSWORD: shortlink
          POSTGRES_DB: shortlink_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shortlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://shortlink:shortlink@localhost:5432/shortlink_test
      REDIS_URL: redis://localhost:6379
      SHORTLINK_DOMAINS: short.example.com
      PUBLIC_BASE_URL: https://short.example.com
      JWT_ACCESS_SECRET: test_access_secret_at_least_32_bytes_long
      JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_bytes_long
      SHORTCODE_SECRET: test_shortcode_secret_at_least_32_bytes_l
      IP_HASH_SALT: test_salt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run database migrations
        run: npm run migrate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t shortlink-api:${{ github.sha }} -f Dockerfile .

      - name: Build worker image
        run: docker build -t shortlink-worker:${{ github.sha }} -f Dockerfile.worker .

      # In a real pipeline: push to a registry (ECR/GCR/GHCR) here, tagged
      # with the commit SHA, then trigger a deploy (Argo CD / Helm upgrade /
      # kubectl set image) against a staging cluster on `main`, promoting to
      # production via a manual approval gate or a separate release workflow.
